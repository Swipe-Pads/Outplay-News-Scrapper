<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Forest Walking Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #2a1515;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        #upload-btn {
            background: rgba(255, 200, 180, 0.8);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #2a1515;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        #upload-btn:hover {
            background: rgba(255, 220, 200, 0.95);
            transform: scale(1.05);
        }
        #file-input {
            display: none;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 200, 180, 0.7);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <button id="upload-btn">Upload Face Image</button>
        <input type="file" id="file-input" accept="image/*">
    </div>
    <div id="info">Walking through the infinite forest...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a1515);
        scene.fog = new THREE.Fog(0x2a1515, 50, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 0);
        camera.lookAt(0, 8, -100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffcccc, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        directionalLight.position.set(50, 100, -200);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 10;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(1000, 2000);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x1a2e1a });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -500;
        ground.receiveShadow = true;
        scene.add(ground);

        // Skin tone palettes
        const skinTones = [
            { base: 0xffe5d4, glans: 0xffb5a0 },  // Very pale
            { base: 0xffd5c4, glans: 0xffa090 },  // Pale pink
            { base: 0xf5c4a8, glans: 0xf09080 },  // Light tan
            { base: 0xe0a888, glans: 0xd08070 },  // Tan
            { base: 0xc68c6c, glans: 0xb07060 },  // Medium tan
            { base: 0xa87050, glans: 0x904050 },  // Brown
            { base: 0x8a5a3c, glans: 0x703848 },  // Dark brown
            { base: 0x6c4430, glans: 0x502838 },  // Deep brown
            { base: 0x4a3020, glans: 0x401828 },  // Very dark
            { base: 0x3a2418, glans: 0x301020 },  // Deep black
        ];

        // Voxel geometry for instancing
        const voxelSize = 0.5;
        const voxelGeometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);

        // Tree chunk management
        const chunks = [];
        const chunkSize = 100;
        const numChunks = 6;
        const treesPerChunk = 15;

        // Create instanced mesh for trees
        const maxTreeVoxels = 50000;
        const treeMaterial = new THREE.MeshLambertMaterial({ vertexColors: true });

        // Create tree instances
        class TreeChunk {
            constructor(zPosition) {
                this.zPosition = zPosition;
                this.trees = [];
                this.mesh = null;
                this.generateTrees();
            }

            generateTrees() {
                const positions = [];
                const colors = [];

                for (let i = 0; i < treesPerChunk; i++) {
                    const x = (Math.random() - 0.5) * 80;
                    const z = this.zPosition - Math.random() * chunkSize;
                    const skinTone = skinTones[Math.floor(Math.random() * skinTones.length)];
                    const scale = 0.7 + Math.random() * 0.8;
                    const height = 15 + Math.random() * 20;
                    const girth = 0.8 + Math.random() * 0.6;

                    this.generateTree(x, z, skinTone, scale, height, girth, positions, colors);
                }

                if (positions.length > 0) {
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    geometry.computeVertexNormals();

                    const material = new THREE.MeshLambertMaterial({ vertexColors: true });
                    this.mesh = new THREE.Mesh(geometry, material);
                    this.mesh.castShadow = true;
                    this.mesh.receiveShadow = true;
                    scene.add(this.mesh);
                }
            }

            generateTree(x, z, skinTone, scale, height, girth, positions, colors) {
                const baseColor = new THREE.Color(skinTone.base);
                const glansColor = new THREE.Color(skinTone.glans);
                const hairColor = new THREE.Color(0x1a1008);

                // Testicles (two spheres at base)
                const ballRadius = 2 * scale * girth;
                const ballY = ballRadius;

                for (let side = -1; side <= 1; side += 2) {
                    const ballX = x + side * ballRadius * 0.8;
                    this.addVoxelSphere(ballX, ballY, z, ballRadius, baseColor, positions, colors);
                }

                // Pubic hair around base
                for (let h = 0; h < 30; h++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = ballRadius * 1.5 + Math.random() * ballRadius;
                    const hx = x + Math.cos(angle) * dist;
                    const hz = z + Math.sin(angle) * dist * 0.5;
                    const hy = Math.random() * ballRadius * 0.5;

                    if (Math.random() > 0.3) {
                        this.addVoxel(hx, hy, hz, hairColor, positions, colors);
                    }
                }

                // Shaft with curvature
                const shaftRadius = 1.5 * scale * girth;
                const shaftHeight = height * scale;
                const curveAmount = (Math.random() - 0.5) * 3;
                const curveDir = Math.random() * Math.PI * 2;

                for (let y = ballRadius * 1.5; y < shaftHeight; y += voxelSize) {
                    const progress = y / shaftHeight;
                    const curve = Math.sin(progress * Math.PI) * curveAmount;
                    const cx = x + Math.cos(curveDir) * curve;
                    const cz = z + Math.sin(curveDir) * curve;

                    // Slight taper
                    const radius = shaftRadius * (1 - progress * 0.1);

                    for (let angle = 0; angle < Math.PI * 2; angle += 0.5) {
                        for (let r = 0; r < radius; r += voxelSize) {
                            const vx = cx + Math.cos(angle) * r;
                            const vz = cz + Math.sin(angle) * r;
                            this.addVoxel(vx, y, vz, baseColor, positions, colors);
                        }
                    }
                }

                // Glans (mushroom head)
                const glansY = shaftHeight;
                const glansRadius = shaftRadius * 1.4;
                const glansHeight = shaftRadius * 2;

                // Corona (ridge)
                for (let angle = 0; angle < Math.PI * 2; angle += 0.3) {
                    for (let r = shaftRadius * 0.8; r < glansRadius; r += voxelSize) {
                        const vx = x + Math.cos(angle) * r;
                        const vz = z + Math.sin(angle) * r;
                        this.addVoxel(vx, glansY, vz, glansColor, positions, colors);
                    }
                }

                // Glans dome
                for (let y = 0; y < glansHeight; y += voxelSize) {
                    const progress = y / glansHeight;
                    const radius = glansRadius * Math.cos(progress * Math.PI / 2);

                    for (let angle = 0; angle < Math.PI * 2; angle += 0.4) {
                        for (let r = 0; r < radius; r += voxelSize) {
                            const vx = x + Math.cos(angle) * r;
                            const vz = z + Math.sin(angle) * r;
                            this.addVoxel(vx, glansY + y, vz, glansColor, positions, colors);
                        }
                    }
                }
            }

            addVoxelSphere(cx, cy, cz, radius, color, positions, colors) {
                for (let x = -radius; x <= radius; x += voxelSize) {
                    for (let y = -radius; y <= radius; y += voxelSize) {
                        for (let z = -radius; z <= radius; z += voxelSize) {
                            if (x*x + y*y + z*z <= radius * radius) {
                                this.addVoxel(cx + x, cy + y, cz + z, color, positions, colors);
                            }
                        }
                    }
                }
            }

            addVoxel(x, y, z, color, positions, colors) {
                // Add cube vertices (simplified - just positions for merged geometry)
                const half = voxelSize / 2;
                const vertices = [
                    // Front face
                    x - half, y - half, z + half,
                    x + half, y - half, z + half,
                    x + half, y + half, z + half,
                    x - half, y - half, z + half,
                    x + half, y + half, z + half,
                    x - half, y + half, z + half,
                    // Back face
                    x + half, y - half, z - half,
                    x - half, y - half, z - half,
                    x - half, y + half, z - half,
                    x + half, y - half, z - half,
                    x - half, y + half, z - half,
                    x + half, y + half, z - half,
                    // Top face
                    x - half, y + half, z - half,
                    x - half, y + half, z + half,
                    x + half, y + half, z + half,
                    x - half, y + half, z - half,
                    x + half, y + half, z + half,
                    x + half, y + half, z - half,
                    // Bottom face
                    x - half, y - half, z + half,
                    x - half, y - half, z - half,
                    x + half, y - half, z - half,
                    x - half, y - half, z + half,
                    x + half, y - half, z - half,
                    x + half, y - half, z + half,
                    // Right face
                    x + half, y - half, z + half,
                    x + half, y - half, z - half,
                    x + half, y + half, z - half,
                    x + half, y - half, z + half,
                    x + half, y + half, z - half,
                    x + half, y + half, z + half,
                    // Left face
                    x - half, y - half, z - half,
                    x - half, y - half, z + half,
                    x - half, y + half, z + half,
                    x - half, y - half, z - half,
                    x - half, y + half, z + half,
                    x - half, y + half, z - half,
                ];

                for (let i = 0; i < vertices.length; i += 3) {
                    positions.push(vertices[i], vertices[i + 1], vertices[i + 2]);
                    colors.push(color.r, color.g, color.b);
                }
            }

            dispose() {
                if (this.mesh) {
                    scene.remove(this.mesh);
                    this.mesh.geometry.dispose();
                    this.mesh.material.dispose();
                }
            }
        }

        // Initialize chunks
        for (let i = 0; i < numChunks; i++) {
            chunks.push(new TreeChunk(-i * chunkSize));
        }

        // Particles (floating voxels)
        const particleCount = 500;
        const particleGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const particleMesh = new THREE.InstancedMesh(particleGeometry, particleMaterial, particleCount);

        const particleData = [];
        const dummy = new THREE.Object3D();

        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                x: (Math.random() - 0.5) * 100,
                y: Math.random() * 50,
                z: Math.random() * -300,
                speedY: 0.02 + Math.random() * 0.03,
                swayOffset: Math.random() * Math.PI * 2,
                swaySpeed: 0.5 + Math.random() * 0.5
            });
        }
        scene.add(particleMesh);

        // Celestial Egg (Sun)
        const eggGroup = new THREE.Group();
        eggGroup.position.set(0, 80, -500);

        // Core (peach sphere)
        const coreGeometry = new THREE.SphereGeometry(30, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xffdab9 });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        eggGroup.add(core);

        // Shell (transparent glowing)
        const shellGeometry = new THREE.SphereGeometry(40, 32, 32);
        const shellMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3
        });
        const shell = new THREE.Mesh(shellGeometry, shellMaterial);
        eggGroup.add(shell);

        // Face plane (inside egg)
        const faceGeometry = new THREE.CircleGeometry(20, 32);
        const faceMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0
        });
        const facePlane = new THREE.Mesh(faceGeometry, faceMaterial);
        facePlane.position.z = 15;
        eggGroup.add(facePlane);

        scene.add(eggGroup);

        // Glow effect for egg
        const glowGeometry = new THREE.SphereGeometry(45, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffee,
            transparent: true,
            opacity: 0.1
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        eggGroup.add(glow);

        // Sperm (Dasher) class
        class Sperm {
            constructor() {
                this.group = new THREE.Group();
                this.segments = [];
                this.time = 0;
                this.speed = 2 + Math.random();

                // Head
                const headGeometry = new THREE.SphereGeometry(1.5, 8, 8);
                const headMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
                this.head = new THREE.Mesh(headGeometry, headMaterial);
                this.group.add(this.head);

                // Tail segments
                const tailLength = 20;
                for (let i = 0; i < tailLength; i++) {
                    const size = 0.5 * (1 - i / tailLength);
                    const segGeometry = new THREE.BoxGeometry(size, size, size);
                    const segMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const segment = new THREE.Mesh(segGeometry, segMaterial);
                    segment.position.z = i * 0.8;
                    this.segments.push(segment);
                    this.group.add(segment);
                }

                // Starting position
                this.group.position.set(
                    (Math.random() - 0.5) * 30,
                    5 + Math.random() * 10,
                    camera.position.z - 20
                );

                scene.add(this.group);
            }

            update(delta) {
                this.time += delta * 5;

                // Move towards egg
                this.group.position.z -= this.speed;

                // Zigzag motion
                this.group.position.x += Math.sin(this.time) * 0.3;
                this.group.position.y += Math.cos(this.time * 0.7) * 0.1;

                // Animate tail
                for (let i = 0; i < this.segments.length; i++) {
                    const offset = this.time - i * 0.3;
                    this.segments[i].position.x = Math.sin(offset) * (i * 0.15);
                    this.segments[i].position.y = Math.cos(offset * 0.5) * (i * 0.05);
                }

                // Check if reached egg or too far
                return this.group.position.z > -550;
            }

            dispose() {
                scene.remove(this.group);
                this.head.geometry.dispose();
                this.head.material.dispose();
                this.segments.forEach(seg => {
                    seg.geometry.dispose();
                    seg.material.dispose();
                });
            }
        }

        const sperms = [];
        let spermTimer = 0;

        // File upload handling
        document.getElementById('upload-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const texture = new THREE.TextureLoader().load(event.target.result);
                    faceMaterial.map = texture;
                    faceMaterial.opacity = 1;
                    faceMaterial.needsUpdate = true;
                };
                reader.readAsDataURL(file);
            }
        });

        // Animation
        const clock = new THREE.Clock();
        let cameraZ = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Move camera forward (walking)
            cameraZ -= 8 * delta;
            camera.position.z = cameraZ;
            camera.lookAt(0, 8, cameraZ - 100);

            // Update ground position
            ground.position.z = cameraZ - 500;

            // Recycle chunks
            chunks.forEach((chunk, index) => {
                if (chunk.zPosition > cameraZ + chunkSize) {
                    chunk.dispose();
                    const farthestZ = Math.min(...chunks.map(c => c.zPosition));
                    chunks[index] = new TreeChunk(farthestZ - chunkSize);
                }
            });

            // Update particles
            for (let i = 0; i < particleCount; i++) {
                const p = particleData[i];

                // Fall down
                p.y -= p.speedY;

                // Sway
                const sway = Math.sin(time * p.swaySpeed + p.swayOffset) * 0.5;

                // Wrap around
                if (p.y < 0) p.y = 50;
                if (p.z > cameraZ + 50) p.z = cameraZ - 250;

                dummy.position.set(p.x + sway, p.y, p.z);
                dummy.updateMatrix();
                particleMesh.setMatrixAt(i, dummy.matrix);
            }
            particleMesh.instanceMatrix.needsUpdate = true;

            // Update egg position (always on horizon)
            eggGroup.position.z = cameraZ - 500;

            // Spawn sperms
            spermTimer += delta;
            if (spermTimer > 3 + Math.random() * 2) {
                sperms.push(new Sperm());
                spermTimer = 0;
            }

            // Update sperms
            for (let i = sperms.length - 1; i >= 0; i--) {
                if (!sperms[i].update(delta)) {
                    sperms[i].dispose();
                    sperms.splice(i, 1);
                }
            }

            // Animate egg glow
            glow.scale.setScalar(1 + Math.sin(time) * 0.05);
            shell.rotation.y += delta * 0.1;

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
